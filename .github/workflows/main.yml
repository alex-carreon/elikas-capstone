name: Build, test, and deploy

on:
  push:
    branches: [
      # main
      feat/deployment
    ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./eLikas_backend

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set Up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4

    # name: Create database

    - name: Copy .env
      run: cp .env.testing .env

    - name: Install app
      run: composer install

    # name: Build database

    # name: Test PHPStan
    # run: ./vendor/bin/phpstan analyse

